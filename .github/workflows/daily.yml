name: Daily Activity

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily activity
        run: |
          echo "$(date -u '+%Y-%m-%d')" >> daily-activity.txt

      - name: Commit changes
        run: |
          git config user.name "snmallick2401"
          git config user.email "135153061+snmallick2401@users.noreply.github.com"
          git add daily-activity.txt
          git commit -m "Update daily activity" || exit 0
          git push
